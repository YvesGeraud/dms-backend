# ═══════════════════════════════════════════════════════════════════
#  .gitlab-ci.yml  ←  Este archivo va en el repo del proyecto HIJO
#  Ejemplo: usetprogrammers/base-back
# ═══════════════════════════════════════════════════════════════════

# 1. Hereda TODOS los stages, templates y jobs del proyecto base
include:
  - project: 'usetprogrammers/plantillas'
    ref: main
    file: '/.plantilla.yml'

# 2. Solo sobreescribe la variable que identifica a ESTE proyecto
#    El resto del pipeline (build, tests, publish) viene del include.
variables:
  FOLDER: 'api-dms' # ← única línea que cambia por proyecto


# ─── Opcional: si necesitas cambiar DEPLOY también ─────────────────
# Si el path de despliegue es diferente al que define base, puedes
# sobreescribir jobs individuales así:
#
# publish_dev:
#   variables:
#     ENV_NAME: "dev"
#     DEPLOY: "/var/www/api-dev"   # mismo o diferente al de base
#     FOLDER: "base"
