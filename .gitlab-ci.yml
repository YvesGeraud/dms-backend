stages:
  - dependences
  - build
  - publish

dependences_dev:
  stage: dependences
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  tags:
    - dev
  cache:
    key:
      files:
        - package.json
    paths:
      - node_modules
  script:
    - npm install

build_dev:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  tags:
    - dev
  cache:
    - key:
        files:
          - package.json
      paths:
        - node_modules
    - key: cache-$CI_COMMIT_REF_SLUG
      paths:
        - dist
  script:
    - npx prisma generate
    - npm run build

publish_dev:
  variables:
    DEPLOY: "/var/www/api-dev"
    FOLDER: "dms"
  stage: publish
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  tags:
    - dev
  cache:
    - key:
        files:
          - package.json
      paths:
        - node_modules
    - key: cache-$CI_COMMIT_REF_SLUG
      paths:
        - dist
  script:
    - echo "Desplegando a dev"
    - mkdir -p $DEPLOY/$FOLDER/
    - find $DEPLOY/$FOLDER/ -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +
    - cp -rf $CI_PROJECT_DIR/node_modules/ $DEPLOY/$FOLDER/
    - cp -r $CI_PROJECT_DIR/dist/. $DEPLOY/$FOLDER/
    - mkdir -p $DEPLOY/$FOLDER/tmp/
    - touch $DEPLOY/$FOLDER/tmp/restart.txt