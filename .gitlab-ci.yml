stages:
  - dependences
  - build
  - publish

dependences_uat:
  stage: dependences
  rules:
    - if: $CI_COMMIT_BRANCH == "uat"
  tags:
    - uat
  cache:
    key:
      files:
        - package.json
    paths:
      - node_modules
  script:
    - npm install

build_uat:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "uat"
  tags:
    - uat
  cache:
    - key:
        files:
          - package.json
      paths:
        - node_modules
    - key: cache-$CI_COMMIT_REF_SLUG
      paths:
        - dist
  script:
    - npx prisma generate
    - npm run build
    - cp -f .env dist/

publish_uat:
  variables:
    DEPLOY: "/var/www/api-uat"
    FOLDER: "dms"
  stage: publish
  rules:
    - if: $CI_COMMIT_BRANCH == "uat"
  tags:
    - uat
  cache:
    - key:
        files:
          - package.json
      paths:
        - node_modules
    - key: cache-$CI_COMMIT_REF_SLUG
      paths:
        - dist
  script:
    - echo "Desplegando a uat"
    - mkdir -p $DEPLOY/$FOLDER/
    - rm -rf $DEPLOY/$FOLDER/*
    - cp -rf $CI_PROJECT_DIR/node_modules/ $DEPLOY/$FOLDER/
    - cp -r $CI_PROJECT_DIR/dist/. $DEPLOY/$FOLDER/
    - mkdir -p $DEPLOY/$FOLDER/tmp/
    - touch $DEPLOY/$FOLDER/tmp/restart.txt